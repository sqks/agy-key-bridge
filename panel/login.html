<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AGY Bridge · 登录</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --border: #e7e7e9; --text: #18181b;
    --muted: #8b8b93; --accent: #4f46e5; --accent-soft: #eef2ff; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 340px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 26px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center;
  }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -.2px; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: -2px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; font: inherit; font-size: 14px; padding: 9px 12px;
    border: 1px solid #d4d4d8; border-radius: 9px; background: #fff; color: var(--text);
    letter-spacing: .08em;
  }
  input[type="password"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button {
    all: unset; cursor: pointer; width: 100%; text-align: center;
    margin-top: 16px; padding: 9px 12px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 500;
  }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { color: var(--bad); font-size: 12px; margin-top: 12px; min-height: 18px; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 18px; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">AG</div>
    <div>
      <div class="brand-name">AGY Bridge</div>
      <div class="brand-sub">控制面板</div>
    </div>
  </div>

  <form id="form">
    <label for="password">访问密码</label>
    <input id="password" type="password" autocomplete="current-password" autofocus required />
    <button id="submit" type="submit">进入面板</button>
  </form>
  <div class="err" id="err"></div>
  <div class="foot">面板上有明文 API Key 和账号凭据，进入后请勿截图外传。</div>
</div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('password');
  const button = document.getElementById('submit');
  const err = document.getElementById('err');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    err.textContent = '';
    button.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: input.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || '密码不正确');
      location.replace('/');
    } catch (e) {
      err.textContent = e.message;
      input.select();
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
